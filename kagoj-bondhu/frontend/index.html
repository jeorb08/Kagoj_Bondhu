<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kagoj Bondhu — কাগজ বন্ধু</title>
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
:root{
  --bg:#eef1ec; --surface:#ffffff; --ink:#14201b; --muted:#5b6a62; --line:#d3dbd2;
  --btn:#0d4a37; --btn-ink:#ffffff; --green:#0d6b4d; --green-soft:#dcefe6;
  --red:#c62839; --red-soft:#fbe4e6; --amber:#a86a00; --amber-soft:#fff0cc; --hi:#ffd84d;
  --paper:#fffdf6; --paper-ink:#26261f; --pen:#d02a3b;
  --khata:#a3212f;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1410; --surface:#13201a; --ink:#e8f0ea; --muted:#9db0a5; --line:#25362d;
    --btn:#33b487; --btn-ink:#062017; --green:#4ed0a0; --green-soft:#12301f;
    --red:#ff6b7d; --red-soft:#3a151b; --amber:#f2b44a; --amber-soft:#33270f;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1410; --surface:#13201a; --ink:#e8f0ea; --muted:#9db0a5; --line:#25362d;
  --btn:#33b487; --btn-ink:#062017; --green:#4ed0a0; --green-soft:#12301f;
  --red:#ff6b7d; --red-soft:#3a151b; --amber:#f2b44a; --amber-soft:#33270f;
}
*,*:before,*:after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px);height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Hind Siliguri',system-ui,sans-serif;font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
h1,h2,h3{font-family:'Baloo Da 2','Hind Siliguri',sans-serif;line-height:1.15;margin:0;font-weight:800}
p{margin:0}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px;border-radius:6px}
.wrap{max-width:1140px;margin:0 auto;padding:22px 20px 70px}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.hdr-in{max-width:1140px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;text-align:left}
.brand b{font-family:'Baloo Da 2',sans-serif;font-size:21px;font-weight:800;line-height:1}
.brand small{display:block;color:var(--muted);font-size:13px;line-height:1.2}
.seg{display:flex;border:1.5px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.seg button{padding:3px 14px;border-radius:999px;font-weight:600;font-size:15px;color:var(--muted)}
.seg button.on{background:var(--btn);color:var(--btn-ink)}
.sw{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:var(--muted)}
.sw i{width:38px;height:22px;border-radius:999px;background:var(--line);position:relative;transition:background .2s}
.sw i:after{content:'';position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on i{background:var(--green)} .sw.on i:after{transform:translateX(16px)}
@media(max-width:640px){.sw span{display:none}.brand small{display:none}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 20px;border-radius:12px;font-weight:700;font-size:17px;border:2px solid transparent;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--btn);color:var(--btn-ink)}
.btn.ghost{border-color:var(--ink);color:var(--ink)}
.btn.big{padding:14px 26px;font-size:19px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.back{color:var(--muted);font-weight:600;padding:4px 0}

/* hero */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center;padding:26px 0 40px}
.hero h1{font-size:clamp(34px,5.4vw,62px);letter-spacing:-.01em}
.lead{margin-top:16px;font-size:19px;color:var(--muted);max-width:34em}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
.fine{margin-top:14px;font-size:14px;color:var(--muted)}
.hero-r{position:relative;justify-self:center;width:min(100%,400px)}
.hero-r .sheet{transform:rotate(2deg);box-shadow:0 22px 40px -14px rgba(0,0,0,.4);border-radius:4px}
.hero-r .margin-note{right:-6px;bottom:-26px}
@media(max-width:860px){.hero{grid-template-columns:1fr;gap:34px}}

/* desk of documents */
.sec{font-size:30px;margin:8px 0 18px}
.desk{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;align-items:start}
@media(max-width:980px){.desk{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.desk{grid-template-columns:1fr}}
.tile{display:block;width:100%;text-align:left;position:relative;padding:22px 18px 22px;transition:transform .18s}
.tile:hover{transform:translateY(-4px) rotate(-.6deg)}
.tile h3{font-size:24px;margin-top:14px}
.tile p{font-size:15px;line-height:1.4;margin-top:4px}
.tile .who{display:inline-block;margin-top:12px;font-size:14px;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--hi);color:#2b2500}
.tile .ln{display:block;height:6px;border-radius:3px;background:currentColor;opacity:.13;margin:7px 0}
.tile .ln:nth-child(2){width:72%}.tile .ln:nth-child(3){width:48%}
.t-payslip{background:var(--paper);color:var(--paper-ink);box-shadow:0 10px 24px -12px rgba(0,0,0,.45);margin-top:0}
.t-payslip:before{content:'';position:absolute;top:-10px;left:50%;width:70px;height:22px;transform:translateX(-50%) rotate(-3deg);background:rgba(255,216,77,.75)}
.t-loan{background:var(--paper);color:var(--paper-ink);box-shadow:0 10px 24px -12px rgba(0,0,0,.45);margin-top:18px;border-right:3px dashed #b9b19a;border-radius:2px 0 0 2px}
.t-khata{background:var(--khata);color:#fff;border-radius:4px 14px 14px 4px;box-shadow:0 12px 26px -12px rgba(0,0,0,.6);padding-left:34px;margin-top:6px}
.t-khata:before{content:'';position:absolute;left:12px;top:0;bottom:0;border-left:3px dotted rgba(255,255,255,.55)}
.t-khata .ln{background:#fff;opacity:.3}
.t-khata .who{background:#f5e3a8}
.t-bill{background:var(--paper);color:var(--paper-ink);margin-top:22px;padding-bottom:34px;box-shadow:0 10px 24px -12px rgba(0,0,0,.45);
  -webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/16px 51% repeat-x,linear-gradient(#000 0 0) top/100% 52% no-repeat;
  mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/16px 51% repeat-x,linear-gradient(#000 0 0) top/100% 52% no-repeat}
.tile .ico{font-size:30px;line-height:1}
.badge-hero{position:absolute;top:10px;right:12px;font-family:'Caveat','Galada',cursive;font-size:22px;color:var(--pen);transform:rotate(6deg)}

/* how it works */
.how{margin-top:64px;display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start;border-top:2px solid var(--ink);padding-top:26px}
.how h2{font-size:clamp(28px,4vw,42px)}
.how p.s{margin-top:12px;color:var(--muted);max-width:30em}
.seq{list-style:none;margin:0;padding:0;counter-reset:q}
.seq li{counter-increment:q;display:grid;grid-template-columns:34px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.seq li:before{content:counter(q);width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--bg);font-weight:700;display:grid;place-items:center;font-size:15px}
.seq b{display:block;line-height:1.3}.seq span{font-size:15px;color:var(--muted)}
.seq li.code:before{background:var(--pen)}
@media(max-width:860px){.how{grid-template-columns:1fr}}
.foot{margin-top:40px;font-size:14px;color:var(--muted);max-width:52em}

/* module page */
.mod-top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.mod-top h2{font-size:32px}
.mod-top p{color:var(--muted);width:100%;margin-top:-4px}
.stepper{display:flex;gap:8px;list-style:none;margin:14px 0 22px;padding:0}
.stepper li{flex:1;font-size:14px;font-weight:500;color:var(--muted)}
.stepper li:before{content:'';display:block;height:6px;border-radius:6px;background:var(--line);margin-bottom:6px}
.stepper li.done:before{background:var(--green)}
.stepper li.now{color:var(--ink);font-weight:700}
.stepper li.now:before{background:var(--btn)}
.stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:26px;align-items:start}
.pane-doc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px)}
@media(max-width:860px){.stage{grid-template-columns:1fr}.pane-doc{position:static}}
.side h3{font-size:26px;margin-bottom:6px}
.side .sub{color:var(--muted);margin-bottom:16px}
.box{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:16px 18px}
.box + .box{margin-top:14px}
.note-line{font-size:14px;color:var(--muted);margin-top:10px}

/* the desk / photographed paper */
.table{background:linear-gradient(140deg,#c4a67e,#a58760);border-radius:14px;padding:clamp(18px,4vw,34px);position:relative;overflow:hidden;box-shadow:inset 0 0 70px rgba(0,0,0,.28)}
.photo{position:relative;transform:rotate(-1.1deg);background:var(--paper);color:var(--paper-ink);border-radius:3px;box-shadow:0 20px 30px -12px rgba(0,0,0,.5);}
.photo img{display:block;width:100%;height:auto}
.sheet{padding:22px 22px 28px;font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:14px;background:var(--paper);color:var(--paper-ink);position:relative}
.sh-h{display:flex;gap:10px;align-items:center;border-bottom:2px dashed #b9b19a;padding-bottom:10px;margin-bottom:8px}
.sh-h b{display:block;font-size:15px}.sh-h small{color:#7b7563}
.sq{width:26px;height:26px;background:#0d4a37;border-radius:4px}
.pr{display:flex;justify-content:space-between;gap:12px;padding:3px 0}
.pr b{font-weight:600;position:relative;padding:0 5px}
.sheet hr{border:0;border-top:1px dashed #cfc7b0;margin:8px 0}
.stamp{position:absolute;right:16px;bottom:14px;border:3px solid #b22;color:#b22;font-weight:800;padding:0 10px;transform:rotate(-12deg);opacity:.5;letter-spacing:.1em}
.notebook{padding:12px 18px 22px 50px;font-family:'Caveat','Galada',cursive;font-size:24px;line-height:32px;color:#1f3a7a;position:relative;background:repeating-linear-gradient(transparent 0 31px,#b7cbe3 31px 32px),var(--paper)}
.notebook:before{content:'';position:absolute;left:38px;top:0;bottom:0;border-left:2px solid #e59a9a}
.nb-t{font-weight:700;font-size:28px;color:#a3212f;line-height:40px}
.kh{display:grid;grid-template-columns:64px 1fr auto;gap:8px}
.kh b{font-weight:700;position:relative;padding:0 6px}
.kh.pd b:last-child{color:#1c7a3c}
/* marks on the paper */
[data-f].hl{background:rgba(255,216,77,.55);border-radius:3px}
[data-f].low{background:rgba(255,170,0,.55);border-radius:3px}
[data-f].flash{outline:2px solid #0d6b4d;outline-offset:2px}
[data-f].flag:after{content:'';position:absolute;inset:-7px -11px;border:2.6px solid var(--pen);border-radius:52% 48% 55% 45%/58% 46% 54% 42%;transform:rotate(-2deg);pointer-events:none;animation:pen .8s ease-out both}
@keyframes pen{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.margin-note{position:absolute;right:10px;bottom:-4px;font-family:'Caveat','Galada',cursive;font-weight:700;font-size:30px;line-height:1.05;color:var(--pen);transform:rotate(-5deg);text-shadow:0 1px 0 rgba(255,255,255,.7);max-width:75%;text-align:right;animation:pen .9s .5s ease-out both}
.scan{position:absolute;left:0;right:0;top:-70px;height:70px;pointer-events:none;background:linear-gradient(to bottom,transparent,rgba(0,230,160,.35));border-bottom:3px solid #00e6a0;display:none}
.photo.scanning .scan{display:block;animation:scan 2.6s ease-in-out infinite}
@keyframes scan{to{top:100%}}
.cap{margin-top:12px;font-size:14px;color:var(--muted)}

/* capture */
.drop{display:block;box-sizing:border-box;width:100%;border:3px dashed var(--ink);border-radius:14px;padding:36px 22px;text-align:center;background:var(--surface);cursor:pointer}
.drop.over{background:var(--hi)}
.drop .big-ico{font-size:52px;line-height:1}
.drop h3{margin-top:10px}
.drop p{color:var(--muted);font-size:15px;margin-top:4px}
.tips{margin:12px 0 0;padding-left:20px;color:var(--muted);font-size:15px}
.sample-card{display:flex;gap:14px;align-items:center;text-align:left;width:100%;padding:16px 18px;background:var(--hi);color:#2b2500;border-radius:10px;font-weight:700;font-size:19px}
.sample-card small{display:block;font-weight:500;font-size:14px}

/* read */
.rl{list-style:none;margin:0;padding:0}
.rl li{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--line);opacity:0;transform:translateY(6px);transition:opacity .3s,transform .3s}
.rl li.in{opacity:1;transform:none}
.rl .v{font-weight:700;font-size:19px;text-align:right}
.rl .l{font-size:15px;color:var(--muted)}
.conf{grid-column:1/-1;height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.conf i{display:block;height:100%;background:var(--green)}
.conf.lo i{background:#e09a1a}
.json{margin-top:14px;background:#0f1a15;color:#8ff0c6;border-radius:8px;padding:12px 14px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.5;min-height:60px;max-height:190px;overflow:auto;white-space:pre}
.tag-ai{display:inline-block;font-size:14px;font-weight:600;background:var(--green-soft);color:var(--green);padding:1px 10px;border-radius:999px}
.sim{margin-top:12px;font-size:14px;background:var(--amber-soft);color:var(--amber);border-radius:8px;padding:8px 12px}

/* confirm */
.fld{display:block;padding:10px 0;border-bottom:1px solid var(--line)}
.fld .fl{display:flex;justify-content:space-between;gap:10px;font-size:15px;font-weight:500}
.fld .fl em{font-style:normal;font-size:13px;color:var(--amber);font-weight:700}
.inp{display:flex;align-items:center;margin-top:5px;border:2px solid var(--line);border-radius:8px;background:var(--bg);overflow:hidden}
.inp i{font-style:normal;padding:0 10px;color:var(--muted);font-weight:600;min-width:34px;text-align:center}
.inp input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-weight:700;font-size:19px;padding:8px 10px 8px 0;color:var(--ink);outline:none}
.inp:focus-within{border-color:var(--btn)}
.fld.low .inp{border-color:#e09a1a;background:var(--amber-soft)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.live{margin-top:14px;padding:12px 14px;border-radius:8px;background:var(--green-soft);color:var(--ink);font-size:16px}
.live b{font-family:'Baloo Da 2',sans-serif;font-size:22px}

/* verdict */
.verdict{border-radius:10px;padding:20px 22px 22px;border:2px solid var(--ink);background:var(--surface)}
.verdict.tone-bad{border-color:var(--red)}
.verdict.tone-good{border-color:var(--green)}
.verdict.tone-warn{border-color:var(--amber)}
.v-eye{font-weight:600;font-size:15px;color:var(--muted)}
.tone-bad .v-eye{color:var(--red)}.tone-good .v-eye{color:var(--green)}
.v-big{font-family:'Baloo Da 2','Hind Siliguri',sans-serif;font-weight:800;font-size:clamp(50px,9vw,84px);line-height:1.05;display:inline-block;margin-top:4px;padding:0 8px;background:linear-gradient(transparent 55%,var(--hi) 55% 92%,transparent 92%);color:#14201b}
.v-head{font-family:'Baloo Da 2','Hind Siliguri',sans-serif;font-weight:700;font-size:24px;line-height:1.25;margin-top:6px}
.v-ex{margin-top:12px;font-size:17px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.listen .wv{display:none;gap:2px;align-items:center;height:18px}
.listen .wv i{width:3px;background:currentColor;border-radius:2px;animation:wv .7s ease-in-out infinite}
.listen .wv i:nth-child(2){animation-delay:.15s}.listen .wv i:nth-child(3){animation-delay:.3s}.listen .wv i:nth-child(4){animation-delay:.45s}
@keyframes wv{0%,100%{height:5px}50%{height:18px}}
.listen.on .wv{display:inline-flex}.listen.on .ic{display:none}
.trust{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;font-size:14px;color:var(--muted)}
.trust span{border:1.5px solid var(--line);border-radius:999px;padding:1px 12px}
table.calc{width:100%;border-collapse:collapse;font-size:16px}
table.calc td{padding:8px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.calc td:nth-child(2){text-align:right;font-weight:700;white-space:nowrap;padding-left:12px}
table.calc small{display:block;color:var(--muted);font-size:13px;font-weight:400;line-height:1.3}
table.calc tr:last-child td{border-bottom:0}
.bars{display:grid;gap:10px}
.bar-row{display:grid;grid-template-columns:110px 1fr 84px;gap:10px;align-items:center;font-size:15px}
.bar-track{position:relative;height:26px;background:var(--bg);border-radius:6px}
.bar-fill{height:100%;border-radius:6px;width:0;animation:grow .9s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes grow{to{width:var(--w)}}
.bar-fill.bad{background:var(--red)}.bar-fill.good{background:var(--green)}.bar-fill.warn{background:#e09a1a}
.bar-t{font-weight:700;text-align:right}
.marker{position:absolute;top:-5px;bottom:-5px;border-left:2.5px dashed var(--ink)}
.marker em{position:absolute;top:100%;left:4px;font-style:normal;font-size:12px;color:var(--muted);white-space:nowrap}
.rule{font-size:14px;color:var(--muted);border-left:4px solid var(--hi);padding-left:12px}
.next{font-weight:600}
.box h4{margin:0 0 8px;font-family:'Baloo Da 2',sans-serif;font-size:19px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--ink);border-radius:999px;padding:2px 14px;font-weight:600;font-size:15px}
.chip:hover{background:var(--hi);color:#2b2500;border-color:var(--hi)}
.answer{margin-top:12px;background:var(--bg);border-radius:8px;padding:12px 14px;min-height:54px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:15px;z-index:60;max-width:90vw;text-align:center}
body.low *{animation:none!important;transition:none!important}
body.low .bar-fill{width:var(--w)}
body.low .table{background:#b59a74;box-shadow:none}
body.low [data-f].flag:after{clip-path:none}
body.low .margin-note{animation:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.bar-fill{width:var(--w)}}

.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2 .fld,.inp{min-width:0}.inp input{min-width:0;width:100%;box-sizing:border-box}select{font:inherit;padding:6px;border:1px solid var(--line);border-radius:6px}#vmodule{margin-left:10px}@media(max-width:600px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $=(s,r=document)=>r.querySelector(s);
const state={lang:'bn',low:false,view:'home',step:1,vals:{},conf:{},upload:null,readDone:false,readState:'sample',readError:'',result:null,speaking:false};
/* Rule parameters. Defaults below; overwritten from GET /api/rules (backend/app/rules/packs/*.yaml) when the backend is reachable. */
const RULES={payslip:{monthly_divisor:208,overtime_multiplier:2},loan:{guideline_cap_percent:24},bill:{vat_percent:5,slabs:[[75,5.26],[125,7.20],[100,7.59],[100,8.02],[200,12.67],[Infinity,14.61]]},khata:{overdue_days:60,warning_days:30}};
function applyRules(j){for(const m of ['payslip','loan','bill','khata']){if(!j[m])continue;const {source,slabs,...rest}=j[m];Object.assign(RULES[m],rest);if(slabs)RULES[m].slabs=slabs.map(x=>[x.units==null?Infinity:x.units,x.rate])}}
fetch('/api/rules').then(r=>r.ok?r.json():null).then(j=>{if(j){applyRules(j);state.backend=true}}).catch(()=>{});
let timers=[];
const L=(en,bn)=>state.lang==='bn'?bn:en;
const BN='০১২৩৪৫৬৭৮৯';
const N=v=>{const s=String(v);return state.lang==='bn'?s.replace(/\d/g,d=>BN[d]):s};

function irr(P,inst,n){if(inst*n<=P)return 0;let lo=0,hi=1;for(let i=0;i<120;i++){const m=(lo+hi)/2;const pv=inst*(1-Math.pow(1+m,-n))/m;if(pv>P)lo=m;else hi=m}return(lo+hi)/2}
function khataGroup(v){
  const acc={};
  KH.forEach((e,i)=>{const a=acc[e[1]]||(acc[e[1]]={id:e[1],bal:0,oldest:null});a.bal+=e[4]==='b'?v['e'+i]:-v['e'+i];if(e[4]==='b'&&(!a.oldest||e[0]<a.oldest))a.oldest=e[0]});
  return Object.values(acc).filter(a=>a.bal>0).map(a=>({...a,age:days(a.oldest)})).sort((x,y)=>y.bal-x.bal);
}

async function checkConfirmed(){
  if(state.checking)return;
  if(state.readState==='fallback'){toast(L('Reading failed. Retake or explicitly choose a sample.','পড়া যায়নি। আবার দিন অথবা নমুনা বেছে নিন।'));return}
  const m=state.view,assessment=state.asOf||TODAY;
  let values={...state.vals};
  if(m==='khata')values={entries:KH.map((e,i)=>({date:e[0],name:e[1],amount:state.vals['e'+i],kind:e[4]==='p'?'payment':'credit'}))};
  if(Object.values(state.vals).some(v=>v===null||v===''||!Number.isFinite(Number(v)))){toast(L('Fill every missing value first.','আগে সব অনুপস্থিত মান দিন।'));return}
  state.checking=true;const button=$('[data-act="to4"]');if(button){button.disabled=true;button.textContent=L('Checking and explaining…','যাচাই ও ব্যাখ্যা হচ্ছে…')}
  try{
    const res=await fetch('/api/check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({module:m,values,as_of:m==='khata'?(state.asOf||TODAY):null})});
    const j=await res.json();if(!res.ok)throw new Error(typeof j.detail==='string'?j.detail:'Check the values');
    const current=m==='khata'?{entries:KH.map((e,i)=>({date:e[0],name:e[1],amount:state.vals['e'+i],kind:e[4]==='p'?'payment':'credit'}))}:{...state.vals};
    if(state.view!==m||JSON.stringify(current)!==JSON.stringify(values)||(m==='khata'&&(state.asOf||TODAY)!==assessment))return;state.checked=j;go(4);
  }catch(e){toast(e.message||'Check service unavailable')}
  finally{state.checking=false;if(state.step===3)render()}
}

/* ---------- engine ---------- */
function render(){
  timers.forEach(clearTimeout);timers=[];
  document.documentElement.lang=state.lang==='bn'?'bn':'en';
  document.body.classList.toggle('low',state.low);
  $('#app').innerHTML=header()+(state.view==='home'?home():state.view==='verify'?verifyView():state.view==='compare'?compareView():moduleView());
  if(state.view==='home'||state.view==='verify'||state.view==='compare')return;
  const m=state.view,s=state.step;
  if(s===2)runRead(m);
  if(s===3)markPaper(m,false);
  if(s===4){markPaper(m,true);const r=state.result;if(r.bigNum!=null)countUp($('#big'),r.bigNum,r.fmt)}
}
function markPaper(m,flag){
  const fs=fieldsOf(m);
  if(state.upload)return;
  if(!flag)fs.forEach(f=>{const e=$(`.photo [data-f="${f.k}"]`);if(e)e.classList.add(f.c<.9?'low':'hl')});
  else{const r=state.result;r.flagKeys.forEach(k=>{const e=$(`.photo [data-f="${k}"]`);if(e)e.classList.add('flag')})}
  if(flag&&state.result.note){const p=$('#photo');const n=document.createElement('div');n.className='margin-note';n.textContent=state.result.note;p.appendChild(n)}
}
function runRead(m){
  const fs=fieldsOf(m),lis=[...document.querySelectorAll('#rl li')],photo=$('#photo');
  const jsonAt=n=>'{\n'+fs.slice(0,n).map(f=>`  "${f.k}": ${state.vals[f.k]}`).join(',\n')+(n?'\n':'')+'}';
  const done=()=>{state.readDone=true;photo.classList.remove('scanning');$('#rstat').textContent=state.readState==='fallback'?L('Reading failed','পড়া যায়নি'):L(`read ${N(fs.filter(f=>state.vals[f.k]!=null).length)} numbers`,`${N(fs.filter(f=>state.vals[f.k]!=null).length)}টি সংখ্যা পড়া হয়েছে`);$('#cont2').disabled=state.readState==='fallback';$('#json').textContent=jsonAt(fs.length)};
  const show=i=>{lis[i].classList.add('in');const e=$(`.photo [data-f="${fs[i].k}"]`);if(e&&!state.upload)e.classList.add(fs[i].c<.9?'low':'hl');$('#json').textContent=jsonAt(i+1)};
  if(state.readState==='loading'){$('#rstat').textContent=L('sending your photo to the vision model…','ছবি ভিশন মডেলে পাঠানো হচ্ছে…');return}
  if(state.readDone||state.low){lis.forEach((_,i)=>show(i));done();return}
  const gap=Math.min(420,2600/fs.length);
  fs.forEach((_,i)=>timers.push(setTimeout(()=>show(i),800+i*gap)));
  timers.push(setTimeout(done,800+fs.length*gap+250));
}
function countUp(el,to,fmt){
  if(!el)return;if(state.low){el.textContent=fmt(to);return}
  const t0=performance.now(),D=900;const f=t=>{const p=Math.min(1,(t-t0)/D),e=1-Math.pow(1-p,3);el.textContent=fmt(to*e);if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f);
}
function go(step){if(step===3)state.checked=null;state.step=step;render();window.scrollTo({top:0,behavior:state.low?'auto':'smooth'})}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),3600)}
function setSpeaking(b){state.speaking=b;document.querySelectorAll('.listen').forEach(e=>e.classList.toggle('on',b))}
let activeAudio=null, audioUrl=null, speechSequence=0;
function stopSpeech(){
  speechSequence++;window.speechSynthesis?.cancel();
  if(activeAudio){activeAudio.pause();activeAudio=null}
  if(audioUrl){URL.revokeObjectURL(audioUrl);audioUrl=null}setSpeaking(false);
}
async function speak(text){
  if(state.speaking){stopSpeech();return}
  stopSpeech();const sequence=speechSequence;const language=state.lang;setSpeaking(true);
  try{
    const res=await fetch('/api/speak',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,language})});
    if(!res.ok)throw new Error('Cloud voice unavailable');
    const blob=await res.blob();if(sequence!==speechSequence)return;
    audioUrl=URL.createObjectURL(blob);activeAudio=new Audio(audioUrl);
    activeAudio.onended=()=>{if(sequence===speechSequence)stopSpeech()};
    await activeAudio.play();return;
  }catch(e){
    if(sequence!==speechSequence)return;
    if(audioUrl){URL.revokeObjectURL(audioUrl);audioUrl=null}activeAudio=null;
    if(!('speechSynthesis' in window)){setSpeaking(false);toast(L('Cloud speech unavailable. Read the displayed text.','ক্লাউড কণ্ঠ পাওয়া যায়নি। দেখানো লেখা পড়ুন।'));return}
    const voice=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith(language));
    if(!voice){setSpeaking(false);toast(L('Cloud speech unavailable and no matching device voice is installed.','ক্লাউড কণ্ঠ অনুপলব্ধ এবং এই ডিভাইসে প্রযোজ্য কণ্ঠ নেই।'));return}
    toast(L('Cloud speech unavailable; using device voice.','ক্লাউড কণ্ঠ অনুপলব্ধ; ডিভাইসের কণ্ঠ ব্যবহার হচ্ছে।'));
    const u=new SpeechSynthesisUtterance(text);u.voice=voice;u.lang=voice.lang;
    u.onend=u.onerror=()=>{if(sequence===speechSequence)setSpeaking(false)};speechSynthesis.speak(u);
  }
}

function handleFile(f){
  if(!f)return;if(f.size>12*1024*1024){toast('Maximum file size is 12 MB');return}const rd=new FileReader();
  rd.onload=()=>{const img=new Image();img.onload=()=>{
    const max=state.low?720:1100,s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');
    c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    const data=c.toDataURL('image/jpeg',state.low?.45:.65);
    state.upload={data,before:f.size,after:Math.round(data.length*.75)};readWithAPI(data)};
    img.onerror=()=>toast(L('Could not open this image. Try a JPG or PNG.','ছবিটি খোলা যায়নি। JPG বা PNG চেষ্টা করুন।'));img.src=rd.result};
  rd.readAsDataURL(f);
}

async function readWithAPI(dataUrl){
  const m=state.view;state.readDone=false;state.readError='';state.readState='loading';state.conf={};state.vals=initVals(m);go(2);
  try{
    const r=await fetch('/api/read',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({module:m,image:dataUrl})});
    if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.detail||('HTTP '+r.status))}
    const j=await r.json();
    if(state.view!==m||state.step!==2)return;
    if(m==='khata'){
      if(!j.entries||!j.entries.length)throw new Error(L('No ledger rows found','খাতায় কোনো সারি পাওয়া যায়নি'));
      KH=j.entries.map(e=>[e.date,e.name,e.amount,e.confidence,e.kind==='payment'?'p':'b']);
      state.vals=initVals('khata');
    }else{
      state.vals=initVals(m);
      for(const [k,f] of Object.entries(j.fields)){state.vals[k]=f.value==null?null:f.value;state.conf[k]=f.value==null?0:f.confidence}
    }
    state.readState=j.mode==='mock'?'mock':'live';
    if(state.readState==='live')state.asOf=new Date(Date.now()+6*3600*1000).toISOString().slice(0,10);
  }catch(err){
    if(state.view!==m||state.step!==2)return;
    state.readError=err.message||'Reading request failed';KH=[];state.vals=Object.fromEntries(Object.keys(initVals(m)).map(k=>[k,null]));state.conf={};state.readState='fallback';
    if(err&&err.message&&!/HTTP|Failed to fetch|NetworkError|Load failed/i.test(err.message))toast(err.message);
  }
  state.readDone=false;render();
}
/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act;
  if(act==='retryread'&&state.upload){readWithAPI(state.upload.data);return}
  if(act==='verify'){stopSpeech();state.view='verify';render();return}
  if(act==='home'){stopSpeech();state.view='home';state.upload=null;render();window.scrollTo(0,0)}
  else if(act==='open'){KH=KH_SAMPLE.map(e=>e.slice());state.checked=null;state.asOf=TODAY;state.view=a.dataset.m;state.step=1;state.vals=initVals(a.dataset.m);state.conf={};state.readState='sample';state.upload=null;state.readDone=false;render();window.scrollTo(0,0)}
  else if(act==='sample'){KH=KH_SAMPLE.map(e=>e.slice());state.vals=initVals(state.view);state.conf={};state.upload=null;state.readState='sample';state.readDone=false;go(2)}
  else if(act==='to2')go(2);else if(act==='to3')go(3);else if(act==='to4')checkConfirmed();
  else if(act==='lang'){stopSpeech();state.lang=a.dataset.l;render()}
  else if(act==='low'){state.low=!state.low;render()}
  else if(act==='speak')speak(state.result.speech);
  else if(act==='share'){window.open('https://wa.me/?text='+encodeURIComponent(state.result.speech+'\n\n'+L('Checked with Kagoj Bondhu','কাগজ বন্ধু দিয়ে যাচাই করা')),'_blank','noopener')}
  else if(act==='ask'){const r=khataAsk(a.dataset.q);$('#answer').innerHTML=r.t+(r.send?`<div class="actions"><button class="btn primary" data-act="sendrem">${L('Send on WhatsApp','হোয়াটসঅ্যাপে পাঠান')}</button></div>`:'');state.lastRem=r.t;if(speechSynthesis.speaking)speechSynthesis.cancel();speak(r.t)}
  else if(act==='sendrem')window.open('https://wa.me/?text='+encodeURIComponent(state.lastRem),'_blank','noopener');
});
document.addEventListener('change',e=>{if(e.target.id==='file')handleFile(e.target.files[0])});
document.addEventListener('dragover',e=>{const d=e.target.closest('#drop');if(d){e.preventDefault();d.classList.add('over')}});
document.addEventListener('dragleave',e=>{const d=e.target.closest('#drop');if(d)d.classList.remove('over')});
document.addEventListener('drop',e=>{const d=e.target.closest('#drop');if(d){e.preventDefault();d.classList.remove('over');handleFile(e.dataTransfer.files[0])}});
document.addEventListener('input',e=>{
  const k=e.target.dataset&&e.target.dataset.k;if(!k||e.target.tagName!=='INPUT')return;
  state.checked=null;state.vals[k]=e.target.value===''?null:parseFloat(e.target.value);
  const r=compute(state.view,state.vals);if($('#live'))$('#live').innerHTML=`<b>${r.bigNum!=null?r.fmt(r.bigNum):'✓'}</b> ${r.head}`;
});
document.addEventListener('focusin',e=>{
  const k=e.target.dataset&&e.target.dataset.k;if(!k||e.target.tagName!=='INPUT')return;
  document.querySelectorAll('.flash').forEach(x=>x.classList.remove('flash'));
  const p=$(`.photo [data-f="${k}"]`);if(p)p.classList.add('flash');
});
</script>
